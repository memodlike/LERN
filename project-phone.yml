name: LERNPhone
options:
  bundleIdPrefix: app.lern
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: 'SM4Q4TS5TK'
    CODE_SIGN_STYLE: Automatic
packages:
  LERNCore:
    path: .
targets:
  LERN:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    dependencies:
      - package: LERNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lern.local
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'MinimalBlack MinimalWhite ObsidianGold Titanium GraphiteSlate MidnightAurora DeepSpace Starlight SolarFlare Eclipse CosmicOrbit ForestSanctuary Warm Cool DesertDusk LavenderMist MatchaZen QuoteMark Gradient ParchmentInk CrimsonVelvet EmeraldLibrary IndigoDye'
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: App/LERN.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LERN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: app.lern.local
            CFBundleURLSchemes: [lern]
        NSPhotoLibraryAddUsageDescription: Save quote images you create to your photo library.
        UIApplicationSupportsIndirectInputEvents: true
        BGTaskSchedulerPermittedIdentifiers: [app.lern.local.notification-refresh]
    entitlements:
      path: App/LERN.entitlements
      properties:
        com.apple.security.application-groups: [group.com.memodlike.lern]
  LERNAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/LERNAppTests]
    dependencies:
      - target: LERN
      - package: LERNCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LERN.app/LERN"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.lern.local.apptests
  LERNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/LERNUITests]
    dependencies:
      - target: LERN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lern.local.uitests
schemes:
  LERN:
    build:
      targets:
        LERN: all
        LERNAppTests: [test]
        LERNUITests: [test]
    test:
      targets: [LERNAppTests, LERNUITests]
