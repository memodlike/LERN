name: iOS QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Core tests and 100k benchmark
        env:
          LERN_LARGE_TEST: '1'
        run: swift test 2>&1 | tee core-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-tests.log
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build iPhone and extensions
        run: xcodebuild -project LERN.xcodeproj -scheme LERN -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - name: Verify bundled resources
        run: |
          APP=DerivedData/Build/Products/Debug-iphonesimulator/LERN.app
          test -f "$APP/ru.lproj/Localizable.strings"
          test -f "$APP/chime1.caf"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons' "$APP/Info.plist"
      - name: Simulator tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project LERN.xcodeproj -scheme LERN -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData -resultBundlePath QA.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios-test.log
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d QA.xcresult ]; then xcrun xcresulttool export attachments --path QA.xcresult --output-path qa-screenshots; fi
          if [ -d DerivedData/Build/Products/Debug-iphonesimulator/LERN.app ]; then ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/LERN.app LERN-Simulator.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-qa
          path: |
            ios-build.log
            ios-test.log
            QA.xcresult
            qa-screenshots
            LERN-Simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            qa-screenshots/*.png
            qa-screenshots/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-app
          path: LERN-Simulator.zip
  watch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
      - name: Build Watch and complication
        run: xcodebuild -project LERN.xcodeproj -scheme LERNWatch -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' -derivedDataPath WatchDerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee watch-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-build-log
          path: watch-build.log
